<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0e10" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="FER reads seven facial expressions from your camera or photos — live, private and entirely in your browser. Save sessions, compare photos and export reports." />
    <meta property="og:title" content="FER — Facial expression recognition in your browser" />
    <meta property="og:description" content="Seven expressions, read live on your device. Nothing you show it is uploaded." />
    <title>FER — Facial expression recognition in your browser</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>FER needs JavaScript to run the on-device expression model.</noscript>
    <div id="root"></div>
  </body>
</html>
